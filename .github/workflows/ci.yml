name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, curl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Prepare environment
        # .env must exist before composer install: package:discover boots the app,
        # and without .env Laravel defaults to the production environment.
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare test database
        # phpunit.xml points the sqlite connection at a file named "testing",
        # which exists only in local checkouts.
        run: touch testing

      - name: Run tests
        run: php artisan test
